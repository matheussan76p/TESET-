<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos - SAEP</title>
    <link rel="stylesheet" href="./CSS/cadastro.css">
</head>

<body>

    <header class="topo">
        <h2>Cadastro de Produtos</h2>
        <button onclick="window.location.href='principal.html'" class="voltar">Voltar</button>
    </header>

    <main class="conteudo">

        <div class="busca-area">
            <input type="text" id="campoBusca" placeholder="Buscar por nome ,descrição ou SKU...">
            <button onclick="buscarProduto()">Buscar</button>
        </div>

        <form id="produtoForm">

            <h3 id="tituloForm">Adicionar Produto</h3>

            <input type="hidden" id="idProduto">

            <label>Nome</label>
            <input type="text" id="nome">

            <label>Descrição</label>
            <input type="text" id="descricao">

            <label>Estoque Atual</label>
            <input type="number" id="estoque" min="0">

            <label>Estoque Mínimo</label>
            <input type="number" id="estoqueMinimo" min="0">

            <label>Código SKU</label>
            <input type="text" id="sku">

            <button type="submit" id="btnSalvar">Salvar</button>

            <p id="mensagem" class="mensagem"></p>
        </form>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Estoque</th>
                    <th>Mínimo</th>
                    <th>SKU</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabelaProdutos"></tbody>
        </table>

    </main>

    <script src="cadastro.js"></script>
</body>
</html>
