<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Estoque</title>
    <link rel="stylesheet" href="./CSS/estoque.css" />
</head>
<body>

    <header class="topo">
        <h2>Gestão de Estoque</h2>
        <button class="voltar" onclick="window.location.href='principal.html'">Voltar</button>
    </header>

    <div class="conteudo">

        <div class="busca-area card">
            <h3>Buscar Produto</h3>
            <input type="text" id="buscaNome" placeholder="Digite o nome do produto..." />
            <button onclick="buscarProduto()">Buscar</button>
        </div>

        <div class="card">
            <h3>Registrar Entrada/Saída</h3>

            <form id="formMovimentacao">
                <label>Produto:</label>
                <input type="text" id="produto" required />

                <label>Quantidade:</label>
                <input type="number" id="quantidade" required />

                <label>Tipo:</label>
                <select id="tipo">
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>

                <label>Observação:</label>
                <textarea id="obs"></textarea>

                <button type="submit">Registrar</button>
                <p class="mensagem" id="msg"></p>
            </form>
        </div>

        <div class="card">
            <h3>Estoque Atual</h3>
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Estoque Mínimo</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="listaEstoque"></tbody>
            </table>
        </div>

        <div class="card">
            <h3>Histórico de Movimentações</h3>

            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Produto</th>
                        <th>Tipo</th>
                        <th>Quantidade</th>
                        <th>Obs</th>
                    </tr>
                </thead>
                <tbody id="historico"></tbody>
            </table>
        </div>

    </div>

    <script src="estoque.js"></script>
</body>
</html>
